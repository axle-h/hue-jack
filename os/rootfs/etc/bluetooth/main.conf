# hue-jack: a headless A2DP speaker. The daemon opens a pairing window from the web UI
# (Discoverable + Pairable with its own timeout); otherwise only bonded devices reconnect.
[General]
Name = hue-jack
# Audio + Rendering service classes, Audio/Video major class, Loudspeaker minor class.
Class = 0x240414
# 0 = no BlueZ timeout; hue-jack turns Discoverable off itself when its window ends.
DiscoverableTimeout = 0
AlwaysPairable = false
PairableTimeout = 0
# A phone that forgot the pairing can pair again without a confirmation prompt.
JustWorksRepairing = always
FastConnectable = true

[Policy]
AutoEnable = true
ReconnectAttempts = 7
ReconnectIntervals = 1, 2, 4, 8, 16, 32, 64
