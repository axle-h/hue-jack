# The appliance user. It runs PipeWire and WirePlumber (lingering) plus the hue-jack, ytcr and
# shairport-sync user units.
# It also needs the "audio" group for the ALSA device (no logind seat, so no uaccess ACLs). On
# bootc that group lives in /usr/lib/group, where sysusers can't add members, so the Containerfile
# adds huejack to it there. Fedora has no "bluetooth" group; the D-Bus policy grants BlueZ access.
u huejack - "hue-jack appliance" /var/lib/hue-jack /usr/sbin/nologin
