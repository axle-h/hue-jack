# The virtual sink every receiver plays into. hue-jack captures its monitor and is the only
# client that writes to the real (ALSA) output.
context.objects = [
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "hue-jack-in"
            node.description        = "hue-jack input"
            media.class             = "Audio/Sink"
            audio.position          = [ FL FR ]
            audio.rate              = 48000
            monitor.channel-volumes = true
            monitor.passthrough     = true
            object.linger           = true
            # Higher than any ALSA sink, so WirePlumber picks it as the default sink.
            priority.session        = 2500
        }
    }
]
