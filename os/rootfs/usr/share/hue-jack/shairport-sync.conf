// shairport-sync configuration for hue-jack (run by the huejack user unit hue-jack-shairport.service).
// It plays into PipeWire's default sink, which is hue-jack-in on the appliance.
general =
{
	name = "hue-jack";
	output_backend = "pipewire";
	// hue-jack watches MPRIS on the huejack session bus for metadata and to pause this source.
	mpris_service_bus = "session";
	// Leave volume control to AirPlay (the sender's volume slider).
	ignore_volume_control = "no";
};

pipewire =
{
	application_name = "AirPlay (hue-jack)";
	node_name = "hue-jack-airplay";
	// sink_target is left unset: the default sink (hue-jack-in).
};

metadata =
{
	enabled = "yes";
	include_cover_art = "yes";
	cover_art_cache_directory = "/tmp/hue-jack-shairport/coverart";
};

sessioncontrol =
{
	// Let a new AirPlay sender take over from the current one.
	allow_session_interruption = "yes";
	session_timeout = 20;
};
