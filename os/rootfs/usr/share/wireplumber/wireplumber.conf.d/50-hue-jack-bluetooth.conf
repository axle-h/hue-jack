# Bluetooth: an A2DP speaker only. No HFP/HSP, so phones never route calls or the mic here.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
  bluez5.codecs = [ sbc sbc_xq aac ldac aptx aptx_hd ]
  bluez5.hfphsp-backend = "none"
  # AVRCP absolute volume: the phone's volume buttons set our level.
  bluez5.enable-hw-volume = true
}

wireplumber.profiles = {
  main = {
    # Headless: the huejack user has no active logind seat, which would otherwise disable bluez.
    monitor.bluez.seat-monitoring = disabled
    # Always come up with hue-jack-in as the default sink (chosen by priority.session),
    # never a remembered selection.
    hooks.default-nodes.state = disabled
  }
}
