[package]
name = "hue-jack"
description = "Music to Philips Hue appliance: audio delay line, analysis, effects and Hue Entertainment streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["pipewire", "bluetooth"]
# PipeWire capture/playback backend (needs pipewire-devel + clang-devel to build).
pipewire = ["dep:pipewire", "dep:libspa-sys"]
# BlueZ pairing window, agent and bonded devices (needs dbus-devel to build).
bluetooth = ["dep:bluer"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bluer = { version = "0.17.4", features = ["bluetoothd"], optional = true }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
hound = "3.5.1"
libc = "0.2.190"
mdns-sd = "0.21.5"
mime_guess = "2.0.5"
openssl = "0.10.81"
openssl-sys = "0.9"
foreign-types = "0.3"
pipewire = { version = "0.10.1", optional = true, features = ["v1_2_0"] }
libspa-sys = { version = "0.10.1", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
rtrb = "0.4.0"
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
fake-bridge = { path = "../fake-bridge" }
tokio-tungstenite = "0.28"
