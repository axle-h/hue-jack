[package]
name = "fake-bridge"
description = "Test double for a Hue bridge: CLIP v2 over HTTPS and a DTLS-PSK HueStream receiver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-openssl"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
openssl = "0.10.81"
parking_lot = "0.12.5"
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
