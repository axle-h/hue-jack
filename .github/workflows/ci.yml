name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: dnf install -y --setopt=install_weak_deps=False rust cargo clippy rustfmt pipewire-devel clang-devel openssl-devel dbus-devel pkgconf-pkg-config gcc git tar gzip
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Analysis of 60 s runs in under 1 s (release)
        run: cargo test --release -p hue-jack --test analysis -- --ignored perf --nocapture

  node:
    name: web + ytcr (pnpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4   # version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: pnpm -r test